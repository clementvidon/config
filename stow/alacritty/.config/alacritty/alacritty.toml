general.import = ["~/.config/alacritty/colors.toml", "~/.config/alacritty/fonts.toml"]

[colors]
draw_bold_text_with_bright_colors = true

[env]
TERM = "xterm-256color"

[[hints.enabled]]
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.command]
program = "/bin/sh"
args = ["-c", "if [ \"$(uname -s)\" = Darwin ]; then open \"$1\"; else xdg-open \"$1\"; fi", "sh"]

[hints.enabled.binding]
key = "U"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"

[scrolling]
history = 10000

[terminal.shell]
program = "tmux"
args = ["new-session", "-A", "-s", "main"]

[window]
opacity = 1
# opacity = 0.5

[window.dimensions]
columns = 80
lines = 24
