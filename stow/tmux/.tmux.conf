# ~/.tmux.conf

# =============================================================================
# Terminal
# =============================================================================

if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'
set -as terminal-features ",xterm-256color:RGB"
# The outer terminal must support OSC 52. Include tmux for nested sessions.
set -as terminal-features ",xterm*:clipboard,wezterm:clipboard,tmux*:clipboard,screen*:clipboard"

# Refresh VS Code's CLI connection and browser launcher when reattaching.
set -ag update-environment VSCODE_IPC_HOOK_CLI
set -ag update-environment BROWSER

# =============================================================================
# Window titles
# =============================================================================

setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#T"

# =============================================================================
# Status bar
# =============================================================================

set -g status off
set -g status-style fg=colour15,bg=colour0
set -g status-left "P#{pane_index}  "
set -g status-right "%Y-%m-%d (%a)  %H:%M "
bind b set status

# =============================================================================
# Pane borders
# =============================================================================

set -g pane-border-style fg=colour0
set -g pane-active-border-style "bg=default fg=colour0"

# Use a different prefix on the ghost host.
if-shell '[ "$(hostname)" = ghost ]' {
  unbind C-Space
  set -g prefix C-Space
  bind C-Space send-prefix
}

# Preserve the current directory when creating panes and windows.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# =============================================================================
# Vi mode
# =============================================================================

setw -g mode-keys vi
set -s escape-time 0

# =============================================================================
# Copy mode
# =============================================================================

set -g mouse on

# Keep wheel scrolling without mouse-driven selection, paste, or pane changes.
unbind -q -n MouseDown1Pane
unbind -q -n MouseDown1Status
unbind -q -n MouseDown1Border
unbind -q -n MouseDown1ScrollbarUp
unbind -q -n MouseDown1ScrollbarDown
unbind -q -n MouseDown1Control7
unbind -q -n MouseDown1Control8
unbind -q -n MouseDown1Control9
unbind -q -n MouseDown2Pane
unbind -q -n MouseDown3Pane
unbind -q -n MouseDown3Status
unbind -q -n MouseDown3StatusLeft
unbind -q -n MouseDown3Empty
unbind -q -n MouseDrag1Pane
unbind -q -n MouseDrag1Border
unbind -q -n MouseDrag1ScrollbarSlider
unbind -q -n WheelDownStatus
unbind -q -n WheelUpStatus
unbind -q -n DoubleClick1Pane
unbind -q -n TripleClick1Pane
unbind -q -n M-MouseDown3Pane
unbind -q -n M-MouseDown3Status
unbind -q -n M-MouseDown3StatusLeft
unbind -q -n M-MouseDown3Empty
unbind -q -n M-MouseDrag1Pane
unbind -q -n M-MouseDrag1Border
unbind -q -n C-MouseDown1Status
unbind -q -n C-MouseDrag1Pane
unbind -q -n C-MouseDrag1Empty

unbind -q -T copy-mode-vi MouseDown1Pane
unbind -q -T copy-mode-vi MouseDrag1Pane
unbind -q -T copy-mode-vi MouseDragEnd1Pane
unbind -q -T copy-mode-vi DoubleClick1Pane
unbind -q -T copy-mode-vi TripleClick1Pane
unbind -q -T copy-mode MouseDown1Pane
unbind -q -T copy-mode MouseDrag1Pane
unbind -q -T copy-mode MouseDragEnd1Pane
unbind -q -T copy-mode DoubleClick1Pane
unbind -q -T copy-mode TripleClick1Pane

# Applications may write the client's clipboard and create tmux paste buffers.
set -s set-clipboard on
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Native OSC 52 follows the attached client, rather than the server's desktop.
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi Y send-keys -X copy-selection-and-cancel

set -g history-limit 5000

# =============================================================================
# Pane navigation
# =============================================================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# =============================================================================
# Pane resizing
# =============================================================================

bind -n C-S-Up resize-pane -U
bind -n C-S-Down resize-pane -D
bind -n C-S-Left resize-pane -L
bind -n C-S-Right resize-pane -R
bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5

# =============================================================================
# Miscellaneous
# =============================================================================

bind S setw synchronize-panes
bind R source-file ~/.tmux.conf
