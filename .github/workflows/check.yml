name: Check

on:
  push:
  pull_request:

jobs:
  config:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install checks on macOS
        if: runner.os == 'macOS'
        run: brew install gnupg python ripgrep stow tmux

      - name: Install checks on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnupg python3 ripgrep stow tmux vim zsh

      - name: Install pinned Vim plugins
        run: |
          ./install.sh install --no-font vim
          vim -Nu "$HOME/.vimrc" -i NONE -n -es \
            -c 'PlugInstall --sync' -c 'qa!'

      - name: Run checks
        run: ./install.sh check
